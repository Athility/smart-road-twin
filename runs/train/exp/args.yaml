evaluation:
  conf_threshold: 0.25
  iou_threshold: 0.5
  save_confusion_matrix: true
model:
  architecture: yolov8n
  num_classes: 4
  pretrained: true
split:
  test_ratio: 0.1
  train_ratio: 0.7
  val_ratio: 0.2
training:
  batch_size: 16
  epochs: 50
  img_size: 640
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  optimizer: SGD
  patience: 15
  seed: 2026
  warmup_epochs: 3.0
  weight_decay: 0.0005
