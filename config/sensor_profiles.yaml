camera:
  model: "pinhole_ground_plane"
  camera_height_m: 1.35          # Dashboard / windshield camera mounting height above road surface (m)
  pitch_deg: 22.0                # Downward camera pitch angle relative to horizon (deg)
  hfov_deg: 62.0                 # Horizontal field of view (deg)
  vfov_deg: 48.0                 # Vertical field of view (deg)
  focal_length_px: 650.0         # Reference focal length in pixels (for 720x720 sensor frame)
  reference_image_width_px: 720
  reference_image_height_px: 720
  min_depression_deg: 5.0        # Minimum depression angle below horizon to avoid horizon singularity
  class_area_bounds_sqm:
    D40: [0.01, 1.00]            # Pothole physically plausible footprint (0.01 - 1.0 m^2)
    D20: [0.05, 4.00]            # Alligator crack footprint (0.05 - 4.0 m^2)
    D10: [0.01, 1.50]            # Transverse crack footprint (0.01 - 1.5 m^2)
    D00: [0.01, 1.50]            # Longitudinal crack footprint (0.01 - 1.5 m^2)

preprocessing:
  enable_clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]
  color_space: "CIE_LAB_L_CHANNEL"
  fallback_backend: "numpy_pil_ycbcr_bilinear"

mcdm:
  default_method: "both"
  default_profile: "safety-first"
  vikor_v: 0.5
  road_class_ordinal_weights:
    LOCAL: 1
    COLLECTOR: 2
    ARTERIAL: 3
    HIGH_TRAFFIC_CORRIDOR: 4

  # Calibrated priority thresholds for multi-criteria relative closeness (TOPSIS C_i and VIKOR 1 - Q_i).
  # Rationale: In 6-criteria decision spaces with realistic spatial trade-offs (e.g., highway
  # defects have peak volume/PCU/speed/road_class while collector/local defects have closer hospital
  # and school proximity), no single alternative simultaneously achieves the ideal extremum on every axis.
  # Under L2 vector normalization, an alternative dominating physical severity and traffic axes with a
  # spatial trade-off on hospital/school proximity achieves C_i ≈ 0.58–0.77 across named profiles
  # (0.5817–0.5832 under safety-first, 0.7683 under traffic-first, 0.6894 under equity-first).
  # Setting the calibrated thresholds at Critical >= 0.57, High >= 0.45, Medium >= 0.35, Low < 0.35
  # ensures severe structural hazards (such as the 144.5L submerged pothole SRMD-IND-000045-00)
  # consistently trigger Critical municipal dispatch across all profiles while populating every tier.
  priority_thresholds:
    critical: 0.57
    high: 0.45
    medium: 0.35
    legacy_quartiles:
      critical: 0.75
      high: 0.50
      medium: 0.25


