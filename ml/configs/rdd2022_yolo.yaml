# YOLO Dataset Configuration for RDD2022 India Road Distress
# Only contains authentic visual damage annotations (NO synthetic sensor data)

path: data/processed/yolo_rdd2022
train: images/train
val: images/val
test: images/test

# Number of classes
nc: 4

# Class names mapping
names:
  0: D00  # Longitudinal Crack
  1: D10  # Transverse Crack
  2: D20  # Alligator Crack
  3: D40  # Pothole
