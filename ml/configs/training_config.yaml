# Road Damage Detection Training Hyperparameters

model:
  architecture: "yolov8n"
  pretrained: true
  num_classes: 4

training:
  epochs: 50
  batch_size: 16
  img_size: 640
  optimizer: "SGD"
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  patience: 15
  seed: 2026

split:
  train_ratio: 0.70
  val_ratio: 0.20
  test_ratio: 0.10

evaluation:
  conf_threshold: 0.25
  iou_threshold: 0.50
  save_confusion_matrix: true
